spring.application.name=streamora

# CORS
streamora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
streamora.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}

# Icecast
icecast.status-url=${ICECAST_STATUS_URL:http://icecast:8000/status-json.xsl}
icecast.status-timeout-millis=${ICECAST_STATUS_TIMEOUT_MILLIS:1000}

# Pure-FTPd
pureftpd.command=${PUREFTPD_COMMAND:pure-pw}
pureftpd.password-file=${PUREFTPD_PASSWORD_FILE:/etc/pure-ftpd/passwd/pureftpd.passwd}
pureftpd.database-file=${PUREFTPD_DATABASE_FILE:/etc/pure-ftpd/passwd/pureftpd.pdb}
pureftpd.home-directory=${PUREFTPD_HOME_DIRECTORY:/pure-ftpd/uploads}
pureftpd.public-host=${PUREFTPD_PUBLIC_HOST:localhost}
pureftpd.port=${PUREFTPD_PORT:21}
pureftpd.uid=${PUREFTPD_UID:1000}
pureftpd.gid=${PUREFTPD_GID:1000}

# Liquidsoap
liquidsoap.media-directory=${LIQUIDSOAP_MEDIA_DIRECTORY:/pure-ftpd/uploads}
liquidsoap.m3u-directory=${LIQUIDSOAP_M3U_DIRECTORY:/liquidsoap/m3u}
liquidsoap.config-directory=${LIQUIDSOAP_CONFIG_DIRECTORY:/liquidsoap/config}
liquidsoap.control-socket-path=/run/liquidsoap/control.sock
liquidsoap.control-connection-timeout-millis=3000
liquidsoap.control-recovery-timeout-millis=30000
liquidsoap.control-retry-interval-millis=250
