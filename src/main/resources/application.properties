spring.application.name=streamora

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET}

# Pure-FTPd
pureftpd.command=${PUREFTPD_COMMAND:pure-pw}
pureftpd.password-file=${PUREFTPD_PASSWORD_FILE:/etc/pure-ftpd/passwd/pureftpd.passwd}
pureftpd.database-file=${PUREFTPD_DATABASE_FILE:/etc/pure-ftpd/passwd/pureftpd.pdb}
pureftpd.home-directory=${PUREFTPD_HOME_DIRECTORY:/home/ftpusers}
pureftpd.uid=${PUREFTPD_UID:1000}
pureftpd.gid=${PUREFTPD_GID:1000}
