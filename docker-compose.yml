name: streamora

services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamora-application
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:-}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      PUREFTPD_UID: ${PUREFTPD_UID:-1000}
      PUREFTPD_GID: ${PUREFTPD_GID:-1000}
      PUREFTPD_HOME_DIRECTORY: /pure-ftpd/uploads
      PUREFTPD_PUBLIC_HOST: ${PUREFTPD_PUBLIC_HOST:-localhost}
      PUREFTPD_PORT: ${PUREFTPD_PORT:-21}
      LIQUIDSOAP_MEDIA_DIRECTORY: /pure-ftpd/uploads
      LIQUIDSOAP_M3U_DIRECTORY: /liquidsoap/m3u
      LIQUIDSOAP_CONFIG_DIRECTORY: /liquidsoap/config
      ICECAST_STATUS_URL: ${ICECAST_STATUS_URL:-http://icecast:8000/status-json.xsl}
      ICECAST_STATUS_TIMEOUT_MILLIS: ${ICECAST_STATUS_TIMEOUT_MILLIS:-1000}
    ports:
      - "${APPLICATION_PORT:-8080}:8080"
    volumes:
      - ./liquidsoap:/liquidsoap/config
      - liquidsoap_m3u:/liquidsoap/m3u
      - pureftpd_uploads:/pure-ftpd/uploads
      - pureftpd_passwords:/etc/pure-ftpd/passwd
      - liquidsoap_runtime:/run/liquidsoap
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streamora

  mysql:
    image: mysql:8.4
    container_name: streamora-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - streamora

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: streamora-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streamora

  icecast:
    image: infiniteproject/icecast:latest
    container_name: streamora-icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD}
      ICECAST_ADMIN_USERNAME: ${ICECAST_ADMIN_USERNAME}
      ICECAST_ADMIN_EMAIL: ${ICECAST_ADMIN_EMAIL}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_LOCATION: ${ICECAST_LOCATION:-Streamora}
    ports:
      - "${ICECAST_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - streamora

  liquidsoap:
    image: savonet/liquidsoap:v2.3.3
    container_name: streamora-liquidsoap
    command: ["/etc/liquidsoap/radio.liq"]
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/stream.mp3}
      LIQUIDSOAP_HARBOR_PORT: ${LIQUIDSOAP_HARBOR_PORT:-8005}
      LIQUIDSOAP_HARBOR_MOUNT: ${LIQUIDSOAP_HARBOR_MOUNT:-/live}
    ports:
      - "${LIQUIDSOAP_HARBOR_PORT:-8005}:8005"
    volumes:
      - ./liquidsoap:/etc/liquidsoap:ro
      - liquidsoap_m3u:/liquidsoap/m3u:ro
      - pureftpd_uploads:/pure-ftpd/uploads:ro
      - liquidsoap_runtime:/run/liquidsoap
    depends_on:
      icecast:
        condition: service_started
      liquidsoap-runtime-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - streamora

  liquidsoap-runtime-init:
    image: savonet/liquidsoap:v2.3.3
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown 100:101 /run/liquidsoap"]
    volumes:
      - liquidsoap_runtime:/run/liquidsoap
    restart: "no"
    network_mode: none

  pureftpd:
    image: stilliard/pure-ftpd:trixie-latest
    container_name: streamora-pureftpd
    environment:
      PUBLICHOST: ${PUREFTPD_PUBLIC_HOST:-localhost}
      FTP_PASSIVE_PORTS: 30000:30009
      FTP_USER_UID: ${PUREFTPD_UID:-1000}
      FTP_USER_GID: ${PUREFTPD_GID:-1000}
    ports:
      - "${PUREFTPD_PORT:-21}:21"
      - "30000-30009:30000-30009"
    volumes:
      - pureftpd_uploads:/pure-ftpd/uploads
      - pureftpd_passwords:/etc/pure-ftpd/passwd
    restart: unless-stopped
    networks:
      - streamora

  node:
    image: node:26-bookworm-slim
    container_name: streamora-node
    working_dir: /workspace/front-end
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_STREAM_URL: ${VITE_STREAM_URL:-http://localhost:8000/stream.mp3}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./front-end:/workspace/front-end
      - node_modules:/workspace/front-end/node_modules
    restart: unless-stopped
    networks:
      - streamora

volumes:
  mysql_data:
  liquidsoap_m3u:
  pureftpd_uploads:
  pureftpd_passwords:
  liquidsoap_runtime:
  node_modules:

networks:
  streamora:
    name: streamora

