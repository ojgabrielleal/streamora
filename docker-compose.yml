name: streamora

services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamora-application
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:-}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${APPLICATION_PORT:-8080}:8080"
    volumes:
      - pureftpd_files:/data/pureftpd
      - liquidsoap_media:/data/liquidsoap
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streamora

  mysql:
    image: mysql:8.4
    container_name: streamora-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - streamora

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: streamora-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streamora

  icecast:
    image: infiniteproject/icecast:latest
    container_name: streamora-icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD}
      ICECAST_ADMIN_USERNAME: ${ICECAST_ADMIN_USERNAME}
      ICECAST_ADMIN_EMAIL: ${ICECAST_ADMIN_EMAIL}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_LOCATION: ${ICECAST_LOCATION:-Streamora}
    ports:
      - "${ICECAST_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - streamora

  liquidsoap:
    image: savonet/liquidsoap:v2.3.3
    container_name: streamora-liquidsoap
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/stream.mp3}
    volumes:
      - ./infrastructure/liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - liquidsoap_media:/media:ro
    depends_on:
      - icecast
    restart: unless-stopped
    networks:
      - streamora

  pureftpd:
    image: stilliard/pure-ftpd:trixie-latest
    container_name: streamora-pureftpd
    environment:
      PUBLICHOST: ${PUREFTPD_PUBLIC_HOST:-localhost}
      FTP_PASSIVE_PORTS: 30000:30009
    ports:
      - "${PUREFTPD_PORT:-21}:21"
      - "30000-30009:30000-30009"
    volumes:
      - pureftpd_files:/home/ftpusers
      - pureftpd_passwords:/etc/pure-ftpd/passwd
    restart: unless-stopped
    networks:
      - streamora

  node:
    image: node:26-bookworm-slim
    container_name: streamora-node
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - .:/workspace
    restart: unless-stopped
    networks:
      - streamora

volumes:
  mysql_data:
  pureftpd_files:
  pureftpd_passwords:
  liquidsoap_media:

networks:
  streamora:
    name: streamora

